<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121221">
<title>Web Crawler</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-state="menu">
<!--
  Web Crawler - rebuilt for PewPlay from "eggog CHOCH" (CHOCH),
  made by kostik1337 & lampysprites for js13kGames 2020. WTFPL, see LICENSE.
-->
<div id="app">
  <canvas id="screen"></canvas>
  <div id="touch"></div>
  <div id="joy"><div id="joy-knob"></div></div>
  <div id="timer" hidden>00:00:000</div>

  <button id="btn-menu" class="hud-btn" type="button" aria-label="Menu" title="Menu (Esc)" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <button id="btn-mute" class="hud-btn" type="button" aria-label="Mute" title="Mute">
    <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9zM16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
    <svg class="icon-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9zM16 9l6 6M22 9l-6 6"/></svg>
  </button>
  <button id="btn-skip" class="hud-btn wide" type="button" hidden>Skip &rsaquo;</button>

  <div id="nogl" hidden>
    <p>Web Crawler needs WebGL, which is not available in this browser.</p>
  </div>
</div>

<script src="js/shaders.js"></script>
<script src="js/freeverb.js"></script>
<script src="js/audio.js"></script>
<script src="js/renderer.js"></script>
<script src="js/terminal.js"></script>
<script src="js/input.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
